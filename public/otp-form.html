<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Factor Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Inter’, sans-serif;
background: #e8e8e8;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

.card {
background: #ffffff;
border-radius: 20px;
padding: 48px 40px 40px;
width: 420px;
text-align: center;
}

h1 {
font-size: 26px;
font-weight: 700;
color: #2c3542;
margin-bottom: 14px;
letter-spacing: -0.3px;
}

.subtitle {
font-size: 16px;
color: #6b7280;
line-height: 1.5;
margin-bottom: 44px;
}

.input-wrap {
margin-bottom: 40px;
}

.otp-input {
width: 100%;
border: 1.5px solid #d1d5db;
border-radius: 14px;
padding: 20px 24px;
font-family: ‘Inter’, monospace;
font-size: 32px;
font-weight: 600;
letter-spacing: 0.25em;
color: #2c3542;
text-align: center;
outline: none;
background: #fff;
transition: border-color 0.2s, box-shadow 0.2s;
-webkit-appearance: none;
}

.otp-input::placeholder {
color: #d1d5db;
letter-spacing: 0.15em;
font-weight: 400;
font-size: 26px;
}

.otp-input:focus {
border-color: #2ECFBA;
box-shadow: 0 0 0 4px rgba(46, 207, 186, 0.15);
}

.otp-input.error {
border-color: #ef4444;
box-shadow: 0 0 0 4px rgba(239,68,68,0.12);
animation: shake 0.4s ease;
}

@keyframes shake {
0%,100% { transform: translateX(0); }
20%     { transform: translateX(-6px); }
40%     { transform: translateX(6px); }
60%     { transform: translateX(-4px); }
80%     { transform: translateX(4px); }
}

.error-msg {
font-size: 13px;
color: #ef4444;
margin-top: 8px;
display: none;
}
.error-msg.show { display: block; }

.btn-verify {
width: 100%;
background: #2ECFBA;
color: #1a1a1a;
border: none;
border-radius: 14px;
padding: 20px;
font-family: ‘Inter’, sans-serif;
font-size: 16px;
font-weight: 700;
cursor: pointer;
transition: background 0.2s, transform 0.15s;
position: relative;
overflow: hidden;
margin-bottom: 20px;
}

.btn-verify:hover:not(:disabled) { background: #28bfac; }
.btn-verify:active:not(:disabled) { transform: scale(0.99); }
.btn-verify:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-verify.loading { pointer-events: none; }
.btn-verify.loading .btn-text { opacity: 0; }

.spinner {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 20px; height: 20px;
border: 2.5px solid rgba(26,26,26,0.2);
border-top-color: #1a1a1a;
border-radius: 50%;
opacity: 0;
animation: spin 0.7s linear infinite;
}
.btn-verify.loading .spinner { opacity: 1; }
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
.btn-verify.success { background: #22c55e; pointer-events: none; }

.recovery {
font-size: 15px;
color: #6b7280;
cursor: pointer;
transition: color 0.15s;
}
.recovery:hover { color: #2ECFBA; }

</style>
</head>
<body>
<div class="card">
  <h1>Two-Factor Authentication</h1>
  <p class="subtitle">Enter the code generated by your authenticator app</p>

  <div class="input-wrap">
    <input
      class="otp-input"
      id="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      placeholder="······"
      autofocus
    />
    <p class="error-msg" id="errorMsg">Invalid code. Please try again.</p>
  </div>

  <button class="btn-verify" id="verifyBtn" disabled>
    <span class="btn-text">Verify</span>
    <div class="spinner"></div>
  </button>

  <div class="recovery">Use a recovery code</div>

</div>

<script>
  const input = document.getElementById('otp');
  const btn = document.getElementById('verifyBtn');
  const errorMsg = document.getElementById('errorMsg');

  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    btn.disabled = input.value.length < 6;
    input.classList.remove('error');
    errorMsg.classList.remove('show');
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btn.disabled) verify();
  });

  function verify() {
    btn.classList.add('loading');
    btn.disabled = true;
    setTimeout(() => {
      btn.classList.remove('loading');
      btn.classList.add('success');
      btn.querySelector('.btn-text').textContent = '✓  Verified';
    }, 1200);
  }

  btn.addEventListener('click', verify);
</script>

</body>
</html>
